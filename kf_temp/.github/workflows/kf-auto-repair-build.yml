name: KF Auto Repair Build

# Only the repo owner (ELYSIYISLOVE) may trigger via Issues.
# Validates: zip URL + kf_manifest.txt. On build failure, posts e: lines to the issue.
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number (manual re-run)
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    # Owner-only: issue author must match repo owner login (case-insensitive)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        (
          github.event.issue.user.login == github.repository_owner ||
          github.event.issue.user.login == 'ELYSIYISLOVE' ||
          github.event.issue.user.login == 'elysiaislove'
        )
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject unauthorized actor (defense in depth)
        env:
          ACTOR: ${{ github.event.issue.user.login || github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          ACTOR_LC=$(echo "$ACTOR" | tr '[:upper:]' '[:lower:]')
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          case "$ACTOR_LC" in
            elysiaislove|"$OWNER_LC") echo "Authorized: $ACTOR" ;;
            *)
              echo "Unauthorized actor: $ACTOR (owner=$OWNER)"
              exit 1
              ;;
          esac

      - name: Resolve zip URL from Issue body
        id: zipurl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number || inputs.issue_number }}
          EVENT_BODY: ${{ github.event.issue.body }}
        run: |
          set -e
          BODY="${EVENT_BODY:-}"
          if [ -z "$BODY" ] && [ -n "$ISSUE_NUM" ]; then
            BODY=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUM}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('body') or '')")
          fi
          URL=$(printf '%s\n' "$BODY" | grep -oE 'https?://[^[:space:]"]+\.zip' | head -1 || true)
          if [ -z "$URL" ]; then
            echo "No .zip URL found in issue body"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Found zip: $URL"

      - name: Download zip
        run: |
          set -e
          curl -fsSL --max-time 180 "${{ steps.zipurl.outputs.url }}" -o kf_patch.zip
          if ! unzip -t kf_patch.zip >/dev/null 2>&1; then
            echo "Downloaded file is not a valid zip"
            exit 1
          fi

      - name: Validate kf_manifest.txt only
        run: |
          set -e
          rm -rf kf_temp
          mkdir kf_temp
          unzip -q kf_patch.zip -d kf_temp
          if [ ! -f kf_temp/kf_manifest.txt ]; then
            sub=$(find kf_temp -mindepth 2 -maxdepth 2 -name kf_manifest.txt 2>/dev/null | head -1 || true)
            if [ -n "$sub" ]; then
              dir=$(dirname "$sub")
              shopt -s dotglob
              mv "$dir"/* kf_temp/ 2>/dev/null || true
              shopt -u dotglob
            fi
          fi
          if [ ! -f kf_temp/kf_manifest.txt ]; then
            echo "Invalid KF package: kf_manifest.txt not found"
            exit 1
          fi
          echo "Validate OK (zip + kf_manifest.txt)"

      - name: Apply patch from manifest
        run: |
          set -e
          while IFS= read -r FILE || [ -n "$FILE" ]; do
            FILE=$(echo "$FILE" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$FILE" ] && continue
            case "$FILE" in \#*) continue ;; esac
            # Allow workflow updates from package
            if [ ! -f "kf_temp/$FILE" ]; then
              echo "Missing in package: $FILE"
              exit 1
            fi
            mkdir -p "$(dirname "$FILE")"
            cp "kf_temp/$FILE" "$FILE"
            echo "Applied: $FILE"
          done < kf_temp/kf_manifest.txt

      - name: Precheck R.id + braces in patched sources
        run: |
          set -e
          python3 << 'PY'
          import re, pathlib, sys
          root = pathlib.Path(".")
          ids = set()
          for xml in root.glob("app/src/main/res/**/*.xml"):
              ids |= set(re.findall(r'@\+id/(\w+)', xml.read_text(encoding="utf-8", errors="ignore")))
          # Known non-layout ids / nav
          ids |= {"nav_host_fragment"}
          missing = []
          brace_bad = []
          for line in open("kf_temp/kf_manifest.txt", encoding="utf-8", errors="ignore"):
              f = line.strip().replace("\r","")
              if not f or f.startswith("#"): continue
              p = pathlib.Path(f)
              if not p.exists(): continue
              text = p.read_text(encoding="utf-8", errors="ignore")
              if f.endswith(".kt"):
                  if text.count("{") != text.count("}"):
                      brace_bad.append(f"{f}: braces {text.count('{')}/{text.count('}')}")
                  for m in re.findall(r'R\.id\.(\w+)', text):
                      if m not in ids:
                          missing.append(f"{f}: R.id.{m}")
          if brace_bad or missing:
              print("PRECHECK FAILED")
              for x in brace_bad: print("BRACE", x)
              for x in missing: print("RID", x)
              sys.exit(1)
          print("Precheck OK: braces + R.id vs layouts")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
          # fail if gradle failed
          if grep -q "BUILD FAILED\|compileDebugKotlin FAILED\|FAILURE: Build failed" build_log.txt; then
            exit 1
          fi
          if ! grep -q "BUILD SUCCESSFUL" build_log.txt; then
            # still check exit via pipeline — force fail if no success marker
            exit 1
          fi

      - name: Commit success
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "KF-Bot"
          git config user.email "kf-bot@users.noreply.github.com"
          git add -A
          # drop junk before commit
          git rm -rf --ignore-unmatch kf_temp kf_patch.zip issue.json \
            o13rzs.zip papdey.zip *.tmp 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Apply KF patch from issue #${{ github.event.issue.number || inputs.issue_number }}"
          git push

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: KF-build-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: warn

      - name: Comment compile errors (e:) on issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number || inputs.issue_number }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set +e
          [ -z "$ISSUE_NUM" ] && exit 0
          ERR_SNIP=""
          if [ -f build_log.txt ]; then
            # Extract Kotlin e: lines and nearby context (max ~80 lines)
            ERR_SNIP=$(grep -E '^e: |^e：|Unresolved reference|编译错误|BUILD FAILED|What went wrong' build_log.txt | head -80 || true)
          fi
          if [ "$BUILD_OUTCOME" = "success" ]; then
            BODY="✅ **KF Auto Repair: success**

Patch applied, precheck OK, build OK, committed.
Actor: \`${{ github.event.issue.user.login || github.actor }}\`"
          else
            BODY="❌ **KF Auto Repair: failed**

Status: \`${BUILD_OUTCOME:-unknown}\`

### Compile / log excerpts (\`e:\`)
\`\`\`
${ERR_SNIP:-"(no e: lines captured — open Actions log for full output)"}
\`\`\`

> Tip: only use \`R.id\` that exist in layouts; unknown ids fail at compile time."
          fi
          export BODY
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"body": os.environ.get("BODY","")}))')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUM}/comments" \
            -d "$PAYLOAD" || true

      - name: Repo junk cleanup
        if: always()
        run: |
          set +e
          # Local job workspace
          rm -rf kf_patch.zip kf_temp issue.json build_log.txt || true
          # If on success branch we already committed; also purge known junk from tree if present
          git config user.name "KF-Bot" 2>/dev/null
          git config user.email "kf-bot@users.noreply.github.com" 2>/dev/null
          REMOVED=0
          for path in issue.json kf_patch.zip kf_temp o13rzs.zip papdey.zip \
            app/build build .gradle; do
            if [ -e "$path" ]; then
              git rm -rf --ignore-unmatch "$path" 2>/dev/null || rm -rf "$path"
              REMOVED=1
            fi
          done
          # root random zips that are not source
          find . -maxdepth 1 -type f \( -name '*.zip' -o -name 'kf_*.zip' \) ! -name 'gradlew*' \
            -exec git rm -f --ignore-unmatch {} \; 2>/dev/null
          if [ "$REMOVED" = "1" ]; then
            git add -A
            git diff --cached --quiet || {
              git commit -m "chore: cleanup GA/KF junk" && git push || true
            }
          fi

      - name: Repair source
        run: |
          set -e

          echo "=== Find duplicate StorageRepository ==="

          find app/src/main/java -name "*StorageRepository*.kt" -print

          echo "=== Remove old repository implementation ==="

          grep -R "class StorageRepositoryImpl" -n app/src/main/java || true

          find app/src/main/java \
          -path "*data/repository/StorageRepository.kt" \
          -delete

          echo "=== Remove old CameraUIOptimizer ==="

          find app/src/main/java \
          -name "CameraUIOptimizer.kt" \
          -delete

          echo "=== Check result ==="

          grep -R "class StorageRepositoryImpl" \
          -n app/src/main/java || true
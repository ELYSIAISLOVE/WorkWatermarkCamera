name: Android CI

# 出包走 GitHub Actions（决策 D3）：
# 每个提交都跑单测 + Lint + Debug 构建，产物以 artifact 形式附在运行记录上。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单测 + Lint + Debug 包
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Android SDK
        # runner 镜像本身已预装 Android SDK；此 action 在部分镜像上会失败，
        # 因此允许失败，由下一步兜底补齐组件（首次运行即因这一步失败导致整体中断）。
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: 确保 SDK 组件（platform 34 / build-tools 34.0.0）
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "使用 SDK: $SDK_DIR"
          SM=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(ls -d "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          fi
          echo "sdkmanager: ${SM:-未找到}"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          ls "$SDK_DIR/platforms" || true

      - name: 单元测试
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testDebugUnitTest

      - name: 静态检查
        run: ./gradlew --no-daemon --console=plain lintDebug

      - name: 构建 Debug 包
        run: ./gradlew --no-daemon --console=plain assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkCamera-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
          if-no-files-found: ignore

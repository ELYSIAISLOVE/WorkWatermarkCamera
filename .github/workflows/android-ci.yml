name: Android CI

# 出包走 GitHub Actions（决策 D3）：
# 每个提交都跑单测 + Lint + Debug 构建，产物以 artifact 形式附在运行记录上。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单测 + Lint + Debug 包
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 单元测试
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testDebugUnitTest

      - name: 静态检查
        run: ./gradlew --no-daemon --console=plain lintDebug

      - name: 构建 Debug 包
        run: ./gradlew --no-daemon --console=plain assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkCamera-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
          if-no-files-found: ignore

name: Apply KF Update Package

# 基于原 apply-kf-update.yml，仅增加：
# 1) 兼容 kf_v4_*.zip / kf*.zip
# 2) 应用后清理根目录无关压缩包与锁文件（不动 app 源码与 build-stable）
# 3) 可选关闭危险的「清库解压」android.yml（只删这一份，不碰其它 workflow）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-kf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find KF zip
        id: zip
        run: |
          set -e
          ZIP=""
          for name in kf_v4_bitmapdecoder_fix.zip kf_v4_*.zip; do
            for f in $name; do
              if [ -f "$f" ]; then ZIP="$f"; break 2; fi
            done
          done
          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 1 -type f -name "kf*.zip" | head -n 1)
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "No KF package found (need kf*.zip at repo root)"
            ls -la
            exit 1
          fi
          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          echo "Using: $ZIP"

      - name: Extract package
        run: |
          rm -rf kf_temp
          mkdir kf_temp
          unzip -q "${{ steps.zip.outputs.zip }}" -d kf_temp
          echo "=== package tree ==="
          find kf_temp -type f | head -50

      - name: Read manifest and apply files
        run: |
          set -e

          if [ ! -f kf_temp/kf_manifest.txt ]; then
            echo "Missing kf_manifest.txt"
            exit 1
          fi

          while IFS= read -r file || [ -n "$file" ]
          do
            file=$(echo "$file" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$file" ] && continue
            [[ "$file" == \#* ]] && continue

            # 与原 KF 脚本相同：保护 workflow / README / md
            if [[ "$file" == .github/workflows/* ]] || \
               [[ "$file" == README* ]] || \
               [[ "$file" == *.md ]]; then
              echo "Protected: $file"
              continue
            fi

            if [ -f "kf_temp/$file" ]; then
              mkdir -p "$(dirname "$file")"
              cp "kf_temp/$file" "$file"
              echo "Applied: $file"
            else
              echo "Skip missing in package: $file"
            fi
          done < kf_temp/kf_manifest.txt

      - name: Cleanup KF temp and applied package
        run: |
          rm -rf kf_temp
          # 原脚本会删掉本次 kf zip；保留行为
          rm -f "${{ steps.zip.outputs.zip }}"
          echo "Removed applied KF zip and temp"

      - name: Cleanup unrelated root junk
        run: |
          set -e
          # 全量工程备份 zip（源码已在 app/ 中，不影响运行）
          rm -f workcamera-fixed-source.zip \
                WorkCamera-Fixed-Source.zip \
                source.zip \
                "WatermarkCamera_Project (1).zip" \
                WatermarkCamera_Project*.zip \
                2>/dev/null || true

          # 本地/缓存残留
          rm -f configuration-cache.lock gc.properties 2>/dev/null || true

          # 危险：会清空仓库再解压旧 zip 的启动脚本（不影响 App 运行，只影响 CI）
          if [ -f .github/workflows/android.yml ]; then
            if grep -q "Clean repository root\|WatermarkCamera_Project (1).zip" .github/workflows/android.yml 2>/dev/null; then
              rm -f .github/workflows/android.yml
              echo "Removed dangerous android.yml (clean-repo + old zip)"
            fi
          fi

          # 一次性恢复类脚本（修复完成后不再需要）
          rm -f .github/workflows/restore-and-inject-grok-keep-all-zips.yml \
                .github/workflows/restore_android_from_zip_write_repo.yml \
                .github/workflows/one-time-restore-grok-zip.yml \
                2>/dev/null || true

          echo "=== root after cleanup ==="
          ls -la
          echo "=== workflows left ==="
          ls -la .github/workflows/ || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply KF update: BitmapDecoder fix + cleanup junk" || echo "No changes"
          git push

      - name: Hint next step
        run: |
          echo "============================================"
          echo "KF applied. Next: run workflow Build Stable APK"
          echo "============================================"

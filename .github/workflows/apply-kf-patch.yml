name: KF Patch Apply And Build

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number
        required: true
        type: string

  issues:
    types:
      - opened
      - labeled

permissions:
  contents: write
  issues: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      execute: ${{ steps.check.outputs.execute }}
      issue: ${{ steps.check.outputs.issue }}

    steps:
      - id: check
        shell: bash
        run: |
          EXECUTE=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXECUTE=true
            ISSUE="${{ inputs.issue_number }}"
          else
            ISSUE="${{ github.event.issue.number }}"
            TITLE="${{ github.event.issue.title }}"
            LABELS='${{ toJson(github.event.issue.labels) }}'

            echo "$LABELS" | grep -q "kf-patch" && EXECUTE=true
            echo "$TITLE" | grep -q "\[KF\]" && EXECUTE=true
          fi

          echo "execute=$EXECUTE" >> "$GITHUB_OUTPUT"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

  apply:
    needs: check
    if: needs.check.outputs.execute == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Issue
        run: |
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"           "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.check.outputs.issue }}"           > issue.json

      - name: Find KF zip
        id: url
        run: |
          URL=$(grep -oE 'https?[^"]+\.zip' issue.json | head -1)
          if [ -z "$URL" ]; then
            echo "No zip found"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download
        run: |
          curl -L --max-time 120 "${{ steps.url.outputs.url }}" -o kf_patch.zip

      - name: Validate package
        run: |
          mkdir kf_temp
          unzip -q kf_patch.zip -d kf_temp

          test -f kf_temp/kf_manifest.txt || {
            echo "Invalid KF package"
            exit 1
          }

      - name: Apply files
        run: |
          while read FILE
          do
            [ -z "$FILE" ] && continue

            case "$FILE" in
              .github/workflows/*|*.md|README*)
                echo "Protected: $FILE"
                continue
                ;;
            esac

            test -f "kf_temp/$FILE" || exit 1

            mkdir -p "$(dirname "$FILE")"
            cp "kf_temp/$FILE" "$FILE"

          done < kf_temp/kf_manifest.txt

      - name: Commit
        run: |
          git config user.name KF-Bot
          git config user.email kf-bot@github.com
          git add .

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply KF patch from Issue #${{ needs.check.outputs.issue }}"
            git push
          fi

      - name: Trigger APK build
        run: |
          curl -X POST           -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"           "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-stable-apk.yml/dispatches"           -d '{"ref":"main"}'

      - name: Cleanup
        if: always()
        run: |
          rm -rf kf_patch.zip
          rm -rf kf_temp
          rm -rf issue.json

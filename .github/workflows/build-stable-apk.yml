name: Build Stable APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project
        run: |
          test -f gradlew
          test -d app

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --warning-mode all --no-daemon

      - name: Upload temporary APK
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkCamera-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkCamera-build-log
          path: build-log.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Cleanup runner
        if: always()
        run: |
          rm -rf app/build
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper

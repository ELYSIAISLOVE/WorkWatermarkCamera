name: Build Stable APK

on:
  workflow_dispatch:
  push:
    branches:
      - V3
      - main
      - master

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 检查并构建 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "DEBUG: ===== Android 项目结构检查 ====="

          test -f gradlew || {
            echo "DEBUG ERROR: 找不到 gradlew"
            exit 1
          }

          test -f settings.gradle || test -f settings.gradle.kts || {
            echo "DEBUG ERROR: 找不到 settings.gradle/settings.gradle.kts"
            exit 1
          }

          test -d app || {
            echo "DEBUG ERROR: 找不到 app 模块"
            exit 1
          }

          test -d app/src || {
            echo "DEBUG ERROR: 找不到 app/src"
            exit 1
          }

          chmod +x gradlew

          echo "DEBUG: Gradle wrapper:"
          ./gradlew --version

          echo "DEBUG: 项目结构检查通过。"

      - name: 5. Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "DEBUG: ===== Android SDK 检查 ====="
          sdkmanager --list_installed || true

          echo "DEBUG: ANDROID_HOME=$ANDROID_HOME"
          echo "DEBUG: Android SDK 检查完成。"

      - name: 6. Compile Kotlin and Java
        shell: bash
        run: |
          set -o pipefail

          echo "DEBUG: ===== Kotlin/Java 编译检查开始 ====="

          ./gradlew \
            compileDebugKotlin \
            compileDebugJavaWithJavac \
            --stacktrace \
            --no-daemon \
            2>&1 | tee compile_debug.log

      - name: 7. Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          echo "DEBUG: ===== APK 构建开始 ====="

          ./gradlew \
            assembleDebug \
            --stacktrace \
            --no-daemon \
            2>&1 | tee build_debug.log

      - name: 8. Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "DEBUG: ===== APK 检查 ====="

          APK_COUNT="$(find app/build/outputs/apk/debug -type f -name '*.apk' | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "DEBUG ERROR: Gradle 显示成功，但没有找到 APK。"
            exit 1
          fi

          echo "DEBUG: 找到 $APK_COUNT 个 APK："
          find app/build/outputs/apk/debug -type f -name '*.apk' -print

          echo "DEBUG: APK 检查通过。"

      - name: 9. Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkCamera-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 10. Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Compile-Debug-Log-${{ github.sha }}
          path: compile_debug.log
          if-no-files-found: warn
          retention-days: 14

      - name: 11. Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Debug-Log-${{ github.sha }}
          path: build_debug.log
          if-no-files-found: warn
          retention-days: 14

      - name: 12. Print failure summary
        if: failure()
        shell: bash
        run: |
          echo "============================================================"
          echo "DEBUG: APK 构建失败"
          echo "============================================================"
          echo "本工作流不会修改、删除或提交仓库中的任何源码。"
          echo "请下载 Compile-Debug-Log 和 Build-Debug-Log 查看具体错误。"
          echo "============================================================"

          if [ -f compile_debug.log ]; then
            echo "DEBUG: ===== 编译错误摘要 ====="
            grep -E \
              '(^e: |error:|FAILURE:|What went wrong|Execution failed)' \
              compile_debug.log \
              | tail -100 || true
          fi

          if [ -f build_debug.log ]; then
            echo "DEBUG: ===== 构建错误摘要 ====="
            grep -E \
              '(^e: |error:|FAILURE:|What went wrong|Execution failed)' \
              build_debug.log \
              | tail -100 || true
          fi

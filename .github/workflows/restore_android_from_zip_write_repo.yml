name: Restore Android Project From ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repository before restore
        shell: bash
        run: |
          set -e
          echo "===== DEBUG: repository before restore ====="
          pwd
          echo "--- files ---"
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            -print | sort | head -300
          echo "--- zip files ---"
          find . -type f -iname '*.zip' ! -path './.git/*' -print | sort

      - name: Locate ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -type f -iname '*.zip' \
              ! -path './.git/*' \
              ! -path './.github/*' \
              -print
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: repository contains no ZIP file."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "Found multiple ZIP files:"
            printf ' - %s\n' "${ZIPS[@]}"
            echo ""
            echo "The workflow will select the largest ZIP, which is normally the project archive."
          fi

          ZIP="${ZIPS[0]}"
          for candidate in "${ZIPS[@]}"; do
            if [ "$(stat -c%s "$candidate")" -gt "$(stat -c%s "$ZIP")" ]; then
              ZIP="$candidate"
            fi
          done

          echo "Selected ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Inspect ZIP
        shell: bash
        env:
          ZIP: ${{ steps.locate_zip.outputs.zip }}
        run: |
          set -euo pipefail

          echo "===== DEBUG: ZIP content ====="
          unzip -l "$ZIP" | head -250

          echo ""
          echo "===== DEBUG: Android project markers inside ZIP ====="
          unzip -l "$ZIP" | grep -E \
            '(^|/)(gradlew|settings\.gradle(\.kts)?|build\.gradle(\.kts)?|gradle/wrapper/gradle-wrapper\.properties|app/build\.gradle(\.kts)?)($| )' \
            || true

      - name: Extract ZIP to temporary directory
        shell: bash
        env:
          ZIP: ${{ steps.locate_zip.outputs.zip }}
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/restored-project"
          mkdir -p "$RUNNER_TEMP/restored-project"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/restored-project"

          echo "===== DEBUG: extracted top level ====="
          find "$RUNNER_TEMP/restored-project" -maxdepth 3 -type f -print | sort | head -300

      - name: Detect Android project root
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/restored-project"

          # Prefer a directory containing BOTH Gradle wrapper and settings file.
          PROJECT_ROOT="$(
            find "$ROOT" -type f -name 'gradlew' -print0 |
            while IFS= read -r -d '' gradlew; do
              dir="$(dirname "$gradlew")"
              if [ -f "$dir/settings.gradle" ] ||
                 [ -f "$dir/settings.gradle.kts" ]; then
                printf '%s\n' "$dir"
              fi
            done |
            head -n 1
          )"

          # If the executable wrapper is absent, detect settings.gradle directly.
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="$(
              find "$ROOT" \
                \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
                -type f -print |
              while IFS= read -r settings; do
                dir="$(dirname "$settings")"
                if [ -f "$dir/build.gradle" ] ||
                   [ -f "$dir/build.gradle.kts" ]; then
                  printf '%s\n' "$dir"
                fi
              done |
              head -n 1
            )"
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: could not find a recognizable Android/Gradle project in the ZIP."
            echo ""
            echo "The ZIP must contain at least:"
            echo "  gradlew + settings.gradle(.kts)"
            echo "or:"
            echo "  settings.gradle(.kts) + build.gradle(.kts)"
            exit 1
          fi

          echo "Detected project root:"
          echo "$PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Validate restored project before writing
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.detect.outputs.project_root }}
        run: |
          set -euo pipefail

          echo "===== DEBUG: project validation ====="
          test -f "$PROJECT_ROOT/settings.gradle" ||
            test -f "$PROJECT_ROOT/settings.gradle.kts"

          test -f "$PROJECT_ROOT/build.gradle" ||
            test -f "$PROJECT_ROOT/build.gradle.kts"

          if [ -f "$PROJECT_ROOT/gradlew" ]; then
            chmod +x "$PROJECT_ROOT/gradlew"
          fi

          echo "--- project files ---"
          find "$PROJECT_ROOT" -maxdepth 4 -type f \
            -not -path '*/.gradle/*' \
            -print | sort | head -400

          echo ""
          echo "--- important markers ---"
          for f in \
            settings.gradle settings.gradle.kts \
            build.gradle build.gradle.kts \
            gradlew gradlew.bat \
            app/build.gradle app/build.gradle.kts; do
            if [ -e "$PROJECT_ROOT/$f" ]; then
              echo "FOUND: $f"
            fi
          done

      - name: Replace repository contents with restored project
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.detect.outputs.project_root }}
          ZIP: ${{ steps.locate_zip.outputs.zip }}
        run: |
          set -euo pipefail

          echo "===== DEBUG: writing restored project into Git repository ====="

          # Preserve the original ZIP and Git metadata.
          PRESERVE_ZIP="$RUNNER_TEMP/original-project.zip"
          cp "$ZIP" "$PRESERVE_ZIP"

          # Preserve the GitHub workflow files so the workflow is not accidentally deleted.
          PRESERVE_GITHUB="$RUNNER_TEMP/github-workflows"
          rm -rf "$PRESERVE_GITHUB"
          if [ -d ".github" ]; then
            cp -a ".github" "$PRESERVE_GITHUB"
          fi

          # Remove old project files from the working tree, but keep .git,
          # the original ZIP, and .github.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf -- {} +

          # Copy the detected Android project to repository root.
          cp -a "$PROJECT_ROOT"/. .

          # Restore the original ZIP under its original basename.
          ZIP_BASENAME="$(basename "$ZIP")"
          cp "$PRESERVE_ZIP" "./$ZIP_BASENAME"

          # Restore .github if it existed.
          if [ -d "$PRESERVE_GITHUB" ]; then
            rm -rf .github
            cp -a "$PRESERVE_GITHUB" .github
          fi

          # Never keep build output or temporary extraction metadata.
          rm -rf .gradle build app/build
          find . -type d -name '__MACOSX' -prune -exec rm -rf {} + || true
          find . -type f -name '.DS_Store' -delete || true

          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

          echo "===== DEBUG: repository after restore ====="
          find . -maxdepth 4 -type f \
            ! -path './.git/*' \
            -print | sort | head -500

      - name: Verify files are really in Git working tree
        shell: bash
        run: |
          set -euo pipefail

          echo "===== DEBUG: final project verification ====="

          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app

          echo "--- git status ---"
          git status --short

          echo "--- project markers ---"
          ls -la
          test -f gradlew && echo "FOUND gradlew"
          test -d app && echo "FOUND app/"
          test -f settings.gradle && echo "FOUND settings.gradle" || true
          test -f settings.gradle.kts && echo "FOUND settings.gradle.kts" || true

          if ! git status --short | grep -q .; then
            echo "ERROR: no Git changes detected. Nothing would be written to the repository."
            exit 1
          fi

      - name: Commit restored Android project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          echo "===== DEBUG: staged files ====="
          git diff --cached --stat
          git diff --cached --name-status | head -500

          if git diff --cached --quiet; then
            echo "ERROR: staging area is empty."
            exit 1
          fi

          git commit -m "Restore Android project from repaired ZIP"

      - name: Push restored project to current branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"
          echo "Pushing restored project to branch: $BRANCH"

          git push origin "HEAD:$BRANCH"

      - name: Final repository verification
        shell: bash
        run: |
          set -euo pipefail

          echo "===== RESTORE SUCCESS ====="
          echo "The repaired Android project has been committed and pushed."
          echo ""
          echo "Repository root:"
          pwd
          echo ""
          echo "Gradle:"
          ls -l gradlew
          echo ""
          echo "Android module:"
          test -d app && echo "app/ OK"
          echo ""
          echo "Original ZIP files:"
          find . -maxdepth 2 -type f -iname '*.zip' -print

name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # ========== 1. 检出代码 ==========
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 2. 设置 JDK 17 ==========
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== 3. 解压项目（带调试信息） ==========
      - name: Unzip project
        run: |
          echo "=== 当前目录 ==="
          pwd
          ls -la
          
          echo "=== 解压 zip ==="
          unzip -o "WatermarkCamera_Project (1).zip" -d project/
          
          echo "=== 解压后结构 ==="
          find project/ -maxdepth 3 -type f | head -30
          
          echo "=== 检查 gradlew ==="
          ls -la project/app/gradlew
          ls -la project/app/gradle/wrapper/

      # ========== 4. 清理缓存避免冲突 ==========
      - name: Clean gradle cache
        run: |
          rm -rf project/app/.gradle
          rm -rf project/app/app/build

      # ========== 5. 赋予 Gradle 执行权限 ==========
      - name: Grant execute permission for gradlew
        working-directory: project/app
        run: chmod +x gradlew

      # ========== 6. 编译 Debug APK（带详细日志） ==========
      - name: Build Debug APK
        working-directory: project/app
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}

      # ========== 7. 编译 Release APK ==========
      - name: Build Release APK
        working-directory: project/app
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ========== 8. 确认 APK 生成 ==========
      - name: Verify APK output
        run: |
          echo "=== Debug APK ==="
          ls -la project/app/app/build/outputs/apk/debug/ || echo "Debug APK not found"
          
          echo "=== Release APK ==="
          ls -la project/app/app/build/outputs/apk/release/ || echo "Release APK not found"

      # ========== 9. 上传 Debug APK ==========
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: project/app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      # ========== 10. 上传 Release APK ==========
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release
          path: project/app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

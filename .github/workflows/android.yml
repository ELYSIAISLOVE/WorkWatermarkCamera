name: Clean, Extract, Fix and Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # ========== 1. 检出代码 ==========
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========== 2. 清理仓库所有文件（保留 .git 和 .github/workflows） ==========
      - name: Clean repository root
        run: |
          echo "=== 清理前 ==="
          ls -la
          
          echo "=== 删除所有文件（保留 .git 和 .github） ==="
          # 删除根目录下所有文件和目录（除了 .git 和 .github）
          for item in * .*; do
            if [ "$item" = "." ] || [ "$item" = ".." ]; then
              continue
            fi
            if [ "$item" = ".git" ] || [ "$item" = ".github" ]; then
              echo "保留: $item"
              continue
            fi
            rm -rf "$item"
            echo "删除: $item"
          done
          
          echo "=== 清理后 ==="
          ls -la

      # ========== 3. 解压 ZIP ==========
      - name: Unzip project
        run: |
          echo "=== 解压 ZIP ==="
          unzip -o "WatermarkCamera_Project (1).zip" -d /tmp/project/
          
          echo "=== ZIP 内容 ==="
          ls -la /tmp/project/
          ls -la /tmp/project/app/

      # ========== 4. 移动源代码到仓库根目录 ==========
      - name: Move source to repository root
        run: |
          echo "=== 移动文件 ==="
          
          # 移动 app 目录下的所有内容到仓库根目录
          for item in /tmp/project/app/*; do
            name=$(basename "$item")
            mv "$item" "./$name"
            echo "移动: $name"
          done
          
          # 移动隐藏文件
          for item in /tmp/project/app/.*; do
            name=$(basename "$item")
            if [ "$name" != "." ] && [ "$name" != ".." ]; then
              mv "$item" "./$name"
              echo "移动: $name"
            fi
          done
          
          # 删除 ZIP 文件
          rm -f "WatermarkCamera_Project (1).zip"
          
          echo "=== 移动完成 ==="
          ls -la

      # ========== 5. 修复 3 个代码 Bug ==========
      - name: Fix all code bugs
        run: |
          echo "=== 修复 Bug 1: CameraViewModel.kt ==="
          sed -i 's/val result = capturePhotoUseCase()/val result = capturePhotoUseCase(Unit)/' \
            app/src/main/java/com/watermark/camera/ui/camera/CameraViewModel.kt
          
          echo "=== 修复 Bug 2: CameraState.kt ==="
          sed -i 's/sealed class CameraEvent {/sealed class CameraEvent : com.watermark.camera.ui.common.UiEvent {/' \
            app/src/main/java/com/watermark/camera/ui/camera/CameraState.kt
          
          echo "=== 修复 Bug 3: GalleryViewModel.kt ==="
          sed -i 's/sealed class GalleryEvent {/sealed class GalleryEvent : com.watermark.camera.ui.common.UiEvent {/' \
            app/src/main/java/com/watermark/camera/ui/gallery/GalleryViewModel.kt
          
          echo "=== 验证修复 ==="
          grep -n "capturePhotoUseCase(Unit)" app/src/main/java/com/watermark/camera/ui/camera/CameraViewModel.kt
          grep -n "sealed class CameraEvent" app/src/main/java/com/watermark/camera/ui/camera/CameraState.kt
          grep -n "sealed class GalleryEvent" app/src/main/java/com/watermark/camera/ui/gallery/GalleryViewModel.kt

      # ========== 6. 提交修复后的源代码到仓库 ==========
      - name: Commit and push cleaned source code
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add -A
          
          if git diff --cached --quiet; then
            echo "没有变更"
          else
            git commit -m "Clean repository and extract source from ZIP
            
            - Removed old files
            - Extracted WatermarkCamera_Project (1).zip
            - Fixed: capturePhotoUseCase() → capturePhotoUseCase(Unit)
            - Fixed: CameraEvent missing UiEvent
            - Fixed: GalleryEvent missing UiEvent
            - Deleted ZIP file"
            
            git push origin main
            echo "✅ 已推送到仓库"
          fi

      # ========== 7. 设置编译环境 ==========
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Fix gradle.properties
        run: |
          sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/' gradle.properties
          sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/' gradle.properties
          sed -i 's/org.gradle.caching=true/org.gradle.caching=false/' gradle.properties

      - name: Clean build cache
        run: |
          rm -rf .gradle
          rm -rf app/build

      # ========== 8. 编译 APK ==========
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      # ========== 9. 上传 APK ==========
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Build complete
        if: success()
        run: |
          echo "🎉 编译成功！"
          echo "📦 Debug APK: app/build/outputs/apk/debug/app-debug.apk"
          echo "📦 Release APK: app/build/outputs/apk/release/app-release.apk"

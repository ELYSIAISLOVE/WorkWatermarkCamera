name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Unzip project
        run: |
          unzip -o "WatermarkCamera_Project (1).zip" -d extracted/
          ls -la extracted/app/

      - name: Fix gradle.properties (禁用配置缓存)
        run: |
          cd extracted/app
          # 禁用配置缓存，因为与 kapt 不兼容
          sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/' gradle.properties
          # 增加内存
          sed -i 's/org.gradle.jvmargs=-Xmx4096m/org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8/' gradle.properties
          cat gradle.properties

      - name: Clean gradle cache
        run: |
          rm -rf extracted/app/.gradle
          rm -rf extracted/app/app/build

      - name: Build Debug APK
        run: |
          cd extracted/app
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: |
          cd extracted/app
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        run: find extracted/ -name "*.apk" -type f

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: extracted/app/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release
          path: extracted/app/app/build/outputs/apk/release/*.apk

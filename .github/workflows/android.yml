name: Fix Source, Build APK & Self-Rewrite

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  # ========================================================================
  # 一次性任务：修复源码 → 编译 → 自毁重写为纯打包 workflow
  # ========================================================================
  fix-build-rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      # ----------------------------------------------------------------------
      # 0. 检出代码
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect project root
        id: detect
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "❌ 未找到 gradlew，请确认这是一个 Android Gradle 项目"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$GRADLEW")
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT
          echo "✅ 项目根目录: $PROJECT_ROOT"

      # ----------------------------------------------------------------------
      # 1. 自动修复源码中的已知问题（基于 Grok fix log）
      # ----------------------------------------------------------------------
      - name: Auto-fix known source bugs
        run: |
          PROJECT_ROOT="${{ steps.detect.outputs.project_root }}"

          python3 << 'PY'
          import re
          from pathlib import Path

          root = Path("${PROJECT_ROOT}")
          fixed = 0

          print("=" * 60)
          print("🔧 开始自动修复源码中的已知问题")
          print("=" * 60)

          # ================================================================
          # Fix 1: BitmapDecoder setAppContext → lateinit var appContext
          # Issue: C008 - content:// URI 解码需要 Context，但 setAppContext
          #        函数与属性 setter 冲突导致编译/运行时错误
          # ================================================================
          for decoder in root.rglob("BitmapDecoder.kt"):
              text = decoder.read_text(encoding="utf-8")
              orig = text

              # 1a. 移除 setAppContext 函数定义
              text, n = re.subn(
                  r"\n[ \t]*fun setAppContext\([^)]*\)\s*\{[^{}]*\}",
                  "",
                  text,
                  count=1,
              )
              if n > 0:
                  print(f"  ✅ Fix 1a: 移除 setAppContext 函数 ({decoder.name})")
                  fixed += 1

              # 1b. 确保 appContext 是 lateinit var（如果还没有）
              if "lateinit var appContext" not in text and "var appContext" not in text:
                  if "companion object" in text:
                      text = text.replace(
                          "companion object {",
                          "companion object {\n    lateinit var appContext: android.content.Context"
                      )
                  else:
                      # 没有 companion object，在 class body 顶部添加
                      text = text.replace(
                          "class BitmapDecoder",
                          "class BitmapDecoder {\n    companion object {\n        lateinit var appContext: android.content.Context\n    }\n\n    // original class"
                      )
                  print(f"  ✅ Fix 1b: 添加 lateinit appContext ({decoder.name})")
                  fixed += 1

              if text != orig:
                  decoder.write_text(text, encoding="utf-8")

          # ================================================================
          # Fix 2: WatermarkCameraApp 中 setAppContext 调用改为属性赋值
          # Issue: C009 - 设置保存逻辑不完整，同时修复 BitmapDecoder 调用
          # ================================================================
          for app_file in root.rglob("WatermarkCameraApp.kt"):
              text = app_file.read_text(encoding="utf-8")
              orig = text

              text = text.replace(
                  "com.watermark.camera.data.processing.BitmapDecoder.setAppContext(this)",
                  "com.watermark.camera.data.processing.BitmapDecoder.appContext = this.applicationContext",
              )
              text = text.replace(
                  "BitmapDecoder.setAppContext(this)",
                  "BitmapDecoder.appContext = this.applicationContext",
              )

              if text != orig:
                  app_file.write_text(text, encoding="utf-8")
                  print(f"  ✅ Fix 2: 修复 WatermarkCameraApp BitmapDecoder 调用 ({app_file.name})")
                  fixed += 1

          # ================================================================
          # Fix 3: CameraEvent 必须继承 UiEvent
          # Issue: C001 - BaseViewModel 类型参数约束失败，编译阻塞
          # ================================================================
          ui_events = list(root.rglob("UiEvent.kt"))
          if ui_events:
              for camera_event in root.rglob("CameraEvent.kt"):
                  text = camera_event.read_text(encoding="utf-8")
                  if "UiEvent" not in text:
                      # 多种声明格式兼容
                      text = text.replace(
                          "sealed class CameraEvent {",
                          "sealed class CameraEvent : UiEvent {"
                      )
                      text = text.replace(
                          "sealed class CameraEvent\n",
                          "sealed class CameraEvent : UiEvent\n"
                      )
                      text = text.replace(
                          "sealed class CameraEvent(",
                          "sealed class CameraEvent : UiEvent("
                      )
                      camera_event.write_text(text, encoding="utf-8")
                      print(f"  ✅ Fix 3: CameraEvent 继承 UiEvent ({camera_event.name})")
                      fixed += 1

          # ================================================================
          # Fix 4: AGP 8.x buildConfig 默认关闭，需要显式开启
          # Issue: C011 - BuildConfig 找不到，编译阻塞
          # ================================================================
          for bg in root.rglob("build.gradle"):
              text = bg.read_text(encoding="utf-8")
              # 只在存在 viewBinding 且没有 buildConfig 的情况下添加
              if "buildConfig" not in text and "viewBinding" in text:
                  text = text.replace(
                      "viewBinding true",
                      "viewBinding true\n        buildConfig true"
                  )
                  bg.write_text(text, encoding="utf-8")
                  print(f"  ✅ Fix 4: 添加 buildConfig true ({bg.name})")
                  fixed += 1

          # ================================================================
          # Fix 5: local.properties 硬编码 SDK 路径（CI 环境不兼容）
          # Issue: 沙箱路径如 /mnt/agents、/home/workdir 在 GitHub Actions 不存在
       
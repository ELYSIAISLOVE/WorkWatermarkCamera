name: Extract ZIP to Repository and Push Source Code

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unzip project to temp directory
        run: |
          echo "=== 当前仓库文件 ==="
          ls -la
          
          echo "=== 解压 zip ==="
          unzip -o "WatermarkCamera_Project (1).zip" -d /tmp/project/
          
          echo "=== 解压后结构 ==="
          ls -la /tmp/project/
          ls -la /tmp/project/app/

      - name: Move source files to repository root
        run: |
          echo "=== 移动文件到仓库根目录 ==="
          
          # 移动 app 目录下的所有文件到仓库根目录
          mv /tmp/project/app/* .
          mv /tmp/project/app/.* . 2>/dev/null || true
          
          echo "=== 删除 zip 文件 ==="
          rm -f "WatermarkCamera_Project (1).zip"
          
          echo "=== 最终目录结构 ==="
          ls -la

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Commit and push source code
        run: |
          echo "=== 添加所有文件 ==="
          git add -A
          
          echo "=== 检查变更 ==="
          git status
          
          echo "=== 提交并推送 ==="
          git commit -m "Extract source code from ZIP file
          
          - Unzipped WatermarkCamera_Project (1).zip
          - Moved all source files to repository root
          - Deleted ZIP file
          - Ready for GitHub Actions build"
          
          git push origin main

      - name: Verify push
        run: |
          echo "✅ 源代码已成功推送到仓库！"
          echo "请刷新仓库页面查看文件"

name: Unzip and Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unzip source
        run: |
          set -e
          echo "=== 仓库根目录 ==="
          ls -la

          # 按优先级找 zip
          ZIP=""
          for name in source.zip WorkCamera-Fixed-Source.zip "WatermarkCamera_Project (1).zip"; do
            if [ -f "$name" ]; then
              ZIP="$name"
              break
            fi
          done
          if [ -z "$ZIP" ]; then
            ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "❌ 根目录没有 zip，请上传 source.zip"
            exit 1
          fi
          echo "使用 ZIP: $ZIP"

          rm -rf /tmp/src
          mkdir -p /tmp/src
          unzip -q -o "$ZIP" -d /tmp/src

          echo "=== 解压结果 ==="
          find /tmp/src -maxdepth 3 -type d | head -40

          # 自动定位含 gradlew 的目录
          ROOT=$(find /tmp/src -name gradlew -type f | head -1 | xargs dirname)
          if [ -z "$ROOT" ]; then
            echo "❌ zip 里没有 gradlew，不是完整 Android 工程"
            find /tmp/src -maxdepth 4 | head -50
            exit 1
          fi
          echo "工程根目录: $ROOT"

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"
          cp -a "$ROOT"/. "$GITHUB_WORKSPACE/project/"

          echo "=== project 目录 ==="
          ls -la "$GITHUB_WORKSPACE/project"
          test -d "$GITHUB_WORKSPACE/project/app" || { echo "❌ 缺少 app/"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: workcamera-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
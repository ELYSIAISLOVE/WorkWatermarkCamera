name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Unzip project
        run: |
          unzip -o "WatermarkCamera_Project (1).zip" -d extracted/
          ls -la extracted/app/

      - name: Fix gradle.properties
        run: |
          cd extracted/app
          sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/' gradle.properties
          sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/' gradle.properties
          sed -i 's/org.gradle.caching=true/org.gradle.caching=false/' gradle.properties

      - name: Fix all code bugs using Python (more reliable than sed)
        run: |
          cd extracted/app
          python3 << 'EOF'
          import re

          # Fix Bug 1: CameraViewModel.kt
          with open('app/src/main/java/com/watermark/camera/ui/camera/CameraViewModel.kt', 'r') as f:
              content = f.read()
          content = content.replace(
              'val result = capturePhotoUseCase()',
              'val result = capturePhotoUseCase(Unit)'
          )
          with open('app/src/main/java/com/watermark/camera/ui/camera/CameraViewModel.kt', 'w') as f:
              f.write(content)
          print("Fixed CameraViewModel.kt")

          # Fix Bug 2: CameraState.kt
          with open('app/src/main/java/com/watermark/camera/ui/camera/CameraState.kt', 'r') as f:
              content = f.read()
          content = content.replace(
              'sealed class CameraEvent {',
              'sealed class CameraEvent : com.watermark.camera.ui.common.UiEvent {'
          )
          with open('app/src/main/java/com/watermark/camera/ui/camera/CameraState.kt', 'w') as f:
              f.write(content)
          print("Fixed CameraState.kt")

          # Fix Bug 3: GalleryViewModel.kt
          with open('app/src/main/java/com/watermark/camera/ui/gallery/GalleryViewModel.kt', 'r') as f:
              content = f.read()
          content = content.replace(
              'sealed class GalleryEvent {',
              'sealed class GalleryEvent : com.watermark.camera.ui.common.UiEvent {'
          )
          with open('app/src/main/java/com/watermark/camera/ui/gallery/GalleryViewModel.kt', 'w') as f:
              f.write(content)
          print("Fixed GalleryViewModel.kt")
          EOF

      - name: Verify fixes
        run: |
          cd extracted/app
          echo "=== CameraViewModel.kt ==="
          grep -n "capturePhotoUseCase" app/src/main/java/com/watermark/camera/ui/camera/CameraViewModel.kt
          echo "=== CameraState.kt ==="
          grep -n "sealed class CameraEvent" app/src/main/java/com/watermark/camera/ui/camera/CameraState.kt
          echo "=== GalleryViewModel.kt ==="
          grep -n "sealed class GalleryEvent" app/src/main/java/com/watermark/camera/ui/gallery/GalleryViewModel.kt

      - name: Clean everything
        run: |
          rm -rf extracted/app/.gradle
          rm -rf extracted/app/app/build

      - name: Build Debug APK
        run: |
          cd extracted/app
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache --max-workers=1 --stacktrace

      - name: Build Release APK
        run: |
          cd extracted/app
          ./gradlew assembleRelease --no-daemon --no-build-cache --max-workers=1 --stacktrace

      - name: Find APK
        run: find extracted/ -name "*.apk" -type f

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: extracted/app/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release
          path: extracted/app/app/build/outputs/apk/release/*.apk

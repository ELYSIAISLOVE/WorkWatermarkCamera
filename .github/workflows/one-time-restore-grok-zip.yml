name: One-Time Restore Grok ZIP to Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    name: ZIP恢复、整理、编译并写回仓库
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout current ZIP repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Find the only Grok ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "DEBUG: 当前仓库应该还是 ZIP 状态。"
          echo "DEBUG: 开始查找 ZIP，不寻找当前仓库中的 gradlew。"

          mapfile -d '' ZIPS < <(
            find . -type f -iname '*.zip' \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -print0
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "DEBUG ERROR: 没有找到 ZIP。"
            echo "DEBUG: 当前仓库文件："
            find . -maxdepth 3 -type f -not -path './.git/*' -print
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "DEBUG ERROR: 找到多个 ZIP，不能猜测哪一个是 Grok 工程："
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP="${ZIPS[0]}"
          ZIP_REL="${ZIP#./}"

          echo "DEBUG: 找到 ZIP: $ZIP_REL"

          rm -rf .one_time_restore
          mkdir -p .one_time_restore/extracted
          mkdir -p .one_time_restore/backup

          cp -p "$ZIP" .one_time_restore/backup/grok-source.zip
          printf '%s\n' "$ZIP_REL" > .one_time_restore/backup/original-zip-path.txt

          echo "DEBUG: 原 ZIP 已保护。"

      - name: 5. Extract ZIP only on runner
        shell: bash
        run: |
          set -euo pipefail

          echo "DEBUG: ===== 开始解压 ZIP ====="

          unzip -q \
            .one_time_restore/backup/grok-source.zip \
            -d .one_time_restore/extracted

          echo "DEBUG: 解压完成。"
          echo "DEBUG: 解压后前100个文件："

          find .one_time_restore/extracted \
            -maxdepth 5 \
            -type f \
            -print | head -100

      - name: 6. Detect real Android project inside extracted ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "DEBUG: ===== 在解压结果中寻找 Android 工程 ====="

          CANDIDATE=""

          while IFS= read -r -d '' GRADLEW; do
            DIR="$(dirname "$GRADLEW")"

            if [ -d "$DIR/app" ] && \
               { [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; }; then
              if [ -n "$CANDIDATE" ]; then
                echo "DEBUG ERROR: ZIP 内发现多个可能的 Android 工程："
                echo "DEBUG: $CANDIDATE"
                echo "DEBUG: $DIR"
                echo "DEBUG: 为避免恢复错误工程，停止。"
                exit 1
              fi

              CANDIDATE="$DIR"
            fi
          done < <(
            find .one_time_restore/extracted \
              -type f -name gradlew -print0
          )

          if [ -z "$CANDIDATE" ]; then
            echo "DEBUG ERROR: 解压结果中没有找到同时满足以下条件的工程："
            echo "DEBUG: gradlew + app/ + settings.gradle/settings.gradle.kts"
            echo
            echo "DEBUG: ZIP实际内容："
            find .one_time_restore/extracted -maxdepth 8 -type f -print | head -300
            exit 1
          fi

          CANDIDATE="$(cd "$CANDIDATE" && pwd)"

          echo "DEBUG: 找到真正工程根目录：$CANDIDATE"
          echo "GROK_PROJECT_ROOT=$CANDIDATE" >> "$GITHUB_ENV"

      - name: 7. Safely organize restored project
        shell: bash
        env:
          ROOT: ${{ env.GROK_PROJECT_ROOT }}
        run: |
          set -euo pipefail

          echo "DEBUG: ===== 整理解压后的 Grok 工程 ====="

          # 只处理确定属于工作流/错误生成的目录。
          # 不凭猜测移动 Kotlin、Java、XML、资源等业务文件。

          find "$ROOT" -depth -name '${ROOT}' -print0 |
          while IFS= read -r -d '' BAD; do
            echo "DEBUG: 删除异常字面路径：$BAD"
            rm -rf -- "$BAD"
          done

          rm -rf \
            "$ROOT/.grok_restore_work" \
            "$ROOT/.cleanup-backup" \
            "$ROOT/.one_time_restore" \
            "$ROOT/.zip_preserve" \
            2>/dev/null || true

          chmod +x "$ROOT/gradlew"

          echo "DEBUG: 整理完成。"

      - name: 8. Build restored project BEFORE touching repository
        shell: bash
        env:
          ROOT: ${{ env.GROK_PROJECT_ROOT }}
        run: |
          set -o pipefail

          cd "$ROOT"

          echo "DEBUG: ===== 先验证 Grok 工程 ====="

          ./gradlew \
            assembleDebug \
            --stacktrace \
            --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/one_time_build.log"

      - name: 9. Verify APK before repository replacement
        if: success()
        shell: bash
        env:
          ROOT: ${{ env.GROK_PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="$(find "$ROOT/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "DEBUG ERROR: Grok 工程编译完成但没有找到 APK。"
            exit 1
          fi

          echo "DEBUG: Grok 工程 APK 验证成功："
          ls -lh "$APK"

      - name: 10. Replace repository with verified restored project
        if: success()
        shell: bash
        env:
          ROOT: ${{ env.GROK_PROJECT_ROOT }}
        run: |
          set -euo pipefail

          echo "DEBUG: ===== 开始写回当前仓库 ====="

          ZIP_REL="$(cat .one_time_restore/backup/original-zip-path.txt)"
          ZIP_BACKUP="$(cd .one_time_restore/backup && pwd)/grok-source.zip"

          # 删除当前仓库中除 .git 和一次性保护目录之外的内容。
          # 此时 Grok 工程已经成功构建，所以才允许替换。
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.one_time_restore' \
            -exec rm -rf -- {} +

          # 复制已经成功构建的 Grok Android 工程。
          cp -a "$ROOT"/. .

          # 恢复原始 ZIP 到原来的路径。
          mkdir -p "$(dirname "$ZIP_REL")"
          cp -p "$ZIP_BACKUP" "$ZIP_REL"

          echo "DEBUG: 工程已写回。"
          echo "DEBUG: 原 ZIP 已保留：$ZIP_REL"

      - name: 11. Verify repository after replacement
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "DEBUG: ===== 验证写回后的仓库 ====="

          test -f gradlew
          test -d app

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "DEBUG ERROR: 写回后缺少 settings.gradle/settings.gradle.kts。"
            exit 1
          fi

          ZIP_REL="$(cat .one_time_restore/backup/original-zip-path.txt)"
          test -f "$ZIP_REL"

          chmod +x gradlew

          echo "DEBUG: gradlew = OK"
          echo "DEBUG: app = OK"
          echo "DEBUG: settings = OK"
          echo "DEBUG: ZIP = OK"

      - name: 12. Remove one-time working files
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .one_time_restore
          rm -f one_time_build.log

          if [ -e .one_time_restore ]; then
            echo "DEBUG ERROR: 一次性工作目录没有成功清理。"
            exit 1
          fi

          echo "DEBUG: 一次性工作文件已经清理。"

      - name: 13. Commit and push restored project
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "DEBUG: 没有需要提交的变化。"
            exit 0
          fi

          git commit -m "restore: migrate verified Grok Android project"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "DEBUG: 已成功写回当前分支。"

      - name: 14. Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-time-restore-build-log-${{ github.sha }}
          path: one_time_build.log
          if-no-files-found: warn
          retention-days: 14

      - name: 15. Failure summary
        if: failure()
        shell: bash
        run: |
          echo "============================================================"
          echo "DEBUG: 一次性 Grok ZIP 恢复失败"
          echo "============================================================"
          echo "当前仓库不会因为失败而提交不完整工程。"
          echo "只有 Grok ZIP 解压后的 Android 工程成功生成 APK，"
          echo "才会覆盖当前仓库并 push。"
          echo "============================================================"

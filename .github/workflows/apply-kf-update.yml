name: Apply KF Update Package

# Manual path: put kf*.zip at repo root, then run this workflow.
# Validate only: file is zip + contains kf_manifest.txt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-kf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find KF zip
        id: zip
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f \( -name 'kf*.zip' -o -name 'KF*.zip' \) | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No kf*.zip at repository root. Rename your file to start with kf (e.g. kf_v5c.zip)."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP"
          if ! unzip -t "$ZIP" >/dev/null 2>&1; then
            echo "File is not a valid zip"
            exit 1
          fi

      - name: Extract and validate manifest
        run: |
          set -e
          rm -rf kf_temp
          mkdir kf_temp
          unzip -q "${{ steps.zip.outputs.zip }}" -d kf_temp
          if [ ! -f kf_temp/kf_manifest.txt ]; then
            sub=$(find kf_temp -mindepth 2 -maxdepth 2 -name kf_manifest.txt 2>/dev/null | head -1 || true)
            if [ -n "$sub" ]; then
              dir=$(dirname "$sub")
              shopt -s dotglob
              mv "$dir"/* kf_temp/ 2>/dev/null || true
              shopt -u dotglob
            fi
          fi
          if [ ! -f kf_temp/kf_manifest.txt ]; then
            echo "Invalid KF package: kf_manifest.txt not found"
            exit 1
          fi
          echo "Validate OK"

      - name: Apply manifest
        run: |
          set -e
          while IFS= read -r file || [ -n "$file" ]; do
            file=$(echo "$file" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$file" ] && continue
            case "$file" in \#*) continue ;; esac
            if [[ "$file" == .github/workflows/* ]] || [[ "$file" == README* ]] || [[ "$file" == *.md ]]; then
              echo "Protected: $file"
              continue
            fi
            if [ ! -f "kf_temp/$file" ]; then
              echo "Missing in package: $file"
              exit 1
            fi
            mkdir -p "$(dirname "$file")"
            cp "kf_temp/$file" "$file"
            echo "Applied: $file"
          done < kf_temp/kf_manifest.txt

      - name: Cleanup and commit
        run: |
          set -e
          rm -f "${{ steps.zip.outputs.zip }}"
          rm -rf kf_temp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Apply KF update package"
          git push

name: Purge History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Remove build artifacts from history
        run: |
          git filter-repo --path-glob 'app/build/**' --invert-paths --force
          git filter-repo --path-glob '.gradle/**' --invert-paths --force
          git filter-repo --path-glob '.idea/**' --invert-paths --force
          git filter-repo --path-glob '*.iml' --invert-paths --force

      - name: Re-add remote and push
        run: |
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git branch -M main
          git push --force origin main

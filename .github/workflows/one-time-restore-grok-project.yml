name: One-Time Restore Grok ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    name: 解压 Grok ZIP、整理、验证并写回仓库
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Locate Grok ZIP and make protected backup
        shell: bash
        run: |
          set -euo pipefail

          echo "DEBUG: ===== 查找 Grok ZIP ====="

          mapfile -d '' ZIPS < <(
            find . -maxdepth 4 -type f -iname '*.zip'               -not -path './.git/*'               -print0
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "DEBUG ERROR: 仓库中没有找到 ZIP。"
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "DEBUG ERROR: 找到多个 ZIP，拒绝猜测："
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP="${ZIPS[0]}"
          ZIP_REL="${ZIP#./}"

          echo "DEBUG: ZIP = $ZIP_REL"

          rm -rf .one_time_restore
          mkdir -p ".one_time_restore/zip_backup"

          cp -p "$ZIP" ".one_time_restore/zip_backup/grok-source.zip"
          printf '%s\n' "$ZIP_REL" > .one_time_restore/zip_backup/original-path.txt

          echo "DEBUG: 原 ZIP 已保护。"

      - name: 5. Extract Grok ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .one_time_restore/extracted

          unzip -q             .one_time_restore/zip_backup/grok-source.zip             -d .one_time_restore/extracted

          echo "DEBUG: ZIP 解压完成。"

      - name: 6. Find real Android project root
        shell: bash
        run: |
          set -euo pipefail

          echo "DEBUG: ===== 查找 Android 工程根目录 ====="

          ROOT="$(find .one_time_restore/extracted             -type f -name gradlew -print -quit)"

          if [ -z "$ROOT" ]; then
            echo "DEBUG ERROR: ZIP 中没有找到 gradlew。"
            exit 1
          fi

          ROOT="$(dirname "$ROOT")"
          ROOT="$(cd "$ROOT" && pwd)"

          if [ ! -d "$ROOT/app" ]; then
            echo "DEBUG ERROR: gradlew 所在目录没有 app 模块。"
            exit 1
          fi

          if [ ! -f "$ROOT/settings.gradle" ] &&              [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "DEBUG ERROR: Android 工程缺少 settings.gradle/settings.gradle.kts。"
            exit 1
          fi

          echo "DEBUG: 工程根目录 = $ROOT"
          echo "GROK_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: 7. Safely clean malformed paths in extracted project
        shell: bash
        env:
          ROOT: ${{ env.GROK_ROOT }}
        run: |
          set -euo pipefail

          echo "DEBUG: ===== 清理明确错误路径 ====="

          # 只处理名称明确为 ${ROOT} 的错误目录/文件。
          while IFS= read -r -d '' item; do
            echo "DEBUG: 删除异常路径: $item"
            rm -rf -- "$item"
          done < <(
            find "$ROOT" -depth               -name '${ROOT}'               -print0
          )

          # 清理可能由旧工作流产生的临时目录。
          rm -rf             "$ROOT/.grok_restore_work"             "$ROOT/.cleanup-backup"             "$ROOT/.one_time_restore"             "$ROOT/.zip_preserve"             2>/dev/null || true

          echo "DEBUG: 安全整理完成。"

      - name: 8. Save original ZIP location
        shell: bash
        run: |
          set -euo pipefail

          ORIGINAL_ZIP_PATH="$(cat .one_time_restore/zip_backup/original-path.txt)"

          echo "DEBUG: 原 ZIP 路径 = $ORIGINAL_ZIP_PATH"

          mkdir -p .one_time_restore/zip_backup

          echo "$ORIGINAL_ZIP_PATH" > .one_time_restore/zip_backup/original-path.txt

      - name: 9. Replace repository with repaired Grok project
        shell: bash
        env:
          ROOT: ${{ env.GROK_ROOT }}
        run: |
          set -euo pipefail

          echo "DEBUG: ===== 写回 Grok 工程 ====="

          ORIGINAL_ZIP_PATH="$(cat .one_time_restore/zip_backup/original-path.txt)"

          # 将当前仓库的原始 ZIP 临时保护在工作区之外。
          # GitHub runner 工作目录仍在本步骤中，因此使用绝对路径保存。
          PROTECTED_ZIP="$(cd .one_time_restore/zip_backup && pwd)/grok-source.zip"

          # 清理当前仓库内容，但绝不触碰 .git。
          find . -mindepth 1 -maxdepth 1             ! -name '.git'             ! -name '.one_time_restore'             -exec rm -rf -- {} +

          # 写入 Grok 工程。
          cp -a "$ROOT"/. .

          # 恢复 ZIP 到原来的相对路径。
          mkdir -p "$(dirname "$ORIGINAL_ZIP_PATH")"
          cp -p "$PROTECTED_ZIP" "$ORIGINAL_ZIP_PATH"

          echo "DEBUG: Grok 工程已经写回。"
          echo "DEBUG: 原 ZIP 已恢复到: $ORIGINAL_ZIP_PATH"

      - name: 10. Verify restored repository
        shell: bash
        run: |
          set -euo pipefail

          echo "DEBUG: ===== 验证仓库 ====="

          test -f gradlew
          test -d app

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "DEBUG ERROR: settings.gradle/settings.gradle.kts 不存在。"
            exit 1
          fi

          chmod +x gradlew

          ORIGINAL_ZIP_PATH="$(cat .one_time_restore/zip_backup/original-path.txt)"

          test -f "$ORIGINAL_ZIP_PATH" || {
            echo "DEBUG ERROR: 原 ZIP 未恢复。"
            exit 1
          }

          echo "DEBUG: gradlew = OK"
          echo "DEBUG: app = OK"
          echo "DEBUG: settings = OK"
          echo "DEBUG: ZIP = $ORIGINAL_ZIP_PATH"

      - name: 11. Remove temporary restore directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .one_time_restore

          if [ -e .one_time_restore ]; then
            echo "DEBUG ERROR: 一次性临时目录清理失败。"
            exit 1
          fi

          echo "DEBUG: 一次性临时目录已经清除。"

      - name: 12. Compile restored project
        shell: bash
        run: |
          set -o pipefail

          ./gradlew             compileDebugKotlin             compileDebugJavaWithJavac             --stacktrace             --no-daemon             2>&1 | tee one_time_compile.log

      - name: 13. Build APK
        shell: bash
        run: |
          set -o pipefail

          ./gradlew             assembleDebug             --stacktrace             --no-daemon             2>&1 | tee one_time_build.log

      - name: 14. Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug             -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "DEBUG ERROR: APK 没有生成。"
            exit 1
          fi

          echo "DEBUG: APK 构建成功:"
          ls -lh "$APK"

      - name: 15. Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Restored-Grok-Debug-APK-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 16. Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: One-Time-Restore-Logs-${{ github.sha }}
          path: |
            one_time_compile.log
            one_time_build.log
          if-no-files-found: warn
          retention-days: 14

      - name: 17. Commit restored project only after successful build
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          # 清理一次性日志，不把工作流产物提交进仓库。
          rm -f one_time_compile.log one_time_build.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "DEBUG: 没有需要提交的变化。"
            exit 0
          fi

          git commit -m "restore: migrate Grok project as stable baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 18. Failure summary
        if: failure()
        shell: bash
        run: |
          echo "============================================================"
          echo "DEBUG: 一次性恢复工作流失败"
          echo "============================================================"
          echo "只有 APK 构建成功才会提交到当前分支。"
          echo "失败不会自动提交不完整工程。"
          echo "请下载 One-Time-Restore-Logs 查看详细日志。"
          echo "============================================================"

name: Extract ZIP to Repository and Push Source Code

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unzip project
        run: |
          echo "=== 当前仓库文件 ==="
          ls -la
          
          echo "=== 解压 zip 到临时目录 ==="
          unzip -o "WatermarkCamera_Project (1).zip" -d /tmp/project/
          
          echo "=== 查看解压后的结构 ==="
          find /tmp/project/ -maxdepth 2 -type f | head -20

      - name: Move source files to repository root (safely)
        run: |
          echo "=== 安全移动文件 ==="
          
          # 逐个移动目录，避免覆盖 .git
          for item in /tmp/project/app/*; do
            basename_item=$(basename "$item")
            # 跳过 .git 等隐藏目录
            if [[ "$basename_item" != .* ]]; then
              rm -rf "./$basename_item" 2>/dev/null || true
              mv "$item" "./$basename_item"
              echo "Moved: $basename_item"
            fi
          done
          
          # 处理隐藏文件（除了 .git）
          for item in /tmp/project/app/.*; do
            basename_item=$(basename "$item")
            if [[ "$basename_item" != "." && "$basename_item" != ".." && "$basename_item" != ".git" ]]; then
              rm -rf "./$basename_item" 2>/dev/null || true
              mv "$item" "./$basename_item"
              echo "Moved: $basename_item"
            fi
          done
          
          echo "=== 删除 zip 文件 ==="
          rm -f "WatermarkCamera_Project (1).zip"
          
          echo "=== 最终目录 ==="
          ls -la

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Commit and push
        run: |
          git add -A
          git status
          git commit -m "Extract source code from ZIP
          
          - Unzipped WatermarkCamera_Project (1).zip
          - Moved source files to repository root
          - Deleted ZIP file"
          git push origin main

      - name: Verify
        run: |
          echo "✅ 完成！请刷新仓库页面"

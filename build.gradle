// Project-level build.gradle
// Watermark Camera - Android Project
// Target SDK: 34 | Min SDK: 24

plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'com.android.library' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    id 'com.google.dagger.hilt.android' version '2.50' apply false
    id 'androidx.navigation.safeargs.kotlin' version '2.7.7' apply false
}

// Version constants for all modules
ext {
    // Kotlin & Gradle
    kotlin_version = '1.9.22'
    gradle_version = '8.2.2'

    // SDK Versions
    compile_sdk = 34
    target_sdk = 34
    min_sdk = 24

    // Core Libraries
    camerax_version = '1.3.1'
    hilt_version = '2.50'
    room_version = '2.6.1'
    coroutines_version = '1.7.3'
    lifecycle_version = '2.7.0'
    navigation_version = '2.7.7'
    appcompat_version = '1.6.1'
    material_version = '1.11.0'
    constraintlayout_version = '2.1.4'
    activity_ktx_version = '1.8.2'
    fragment_ktx_version = '1.6.2'
    preference_version = '1.2.1'

    // Testing
    junit_version = '4.13.2'
    junit_ext_version = '1.1.5'
    espresso_version = '3.5.1'
    mockk_version = '1.13.9'
    turbine_version = '1.0.0'
}
